trigger:
- main
- features/*

pool: default

stages:
- stage: Pre_commit_static_analysis
  jobs:
    - job: Validate
      displayName: Validate
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
          backendServiceArm: 'AZ-ADO-connection-16'
          backendAzureRmOverrideSubscriptionID: '00ad737d-c579-441c-8386-0551f3fc4bf9'
          backendAzureRmResourceGroupName: 'rgkulvinder'
          backendAzureRmStorageAccountName: 'stgkulvinder'
          backendAzureRmContainerName: 'container1'
          backendAzureRmKey: 'dev.terraform.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'

    - job: Fmt
      displayName: Fmt
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'custom'
          outputTo: 'console'
          customCommand: 'fmt'
          environmentServiceNameAzureRM: 'AZ-ADO-connection-16'
          environmentAzureRmOverrideSubscriptionID: '00ad737d-c579-441c-8386-0551f3fc4bf9'      

    - job: TfSec
      displayName: TFSec
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: 'tfsec .'
    - job: TfLint
      displayName: TFlint
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: 'tflint --chdir .'
- stage: InfraCost
  jobs:
    - job: Infracost
      displayName: Infracost
      steps:
      - task: InfracostSetup@2
        inputs:
          apiKey: '9c7f48f5-21a8-47fe-a38b-3df776e00406'
          version: '0.10.x'
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            $env:INFRACOST_API_KEY = "9c7f48f5-21a8-47fe-a38b-3df776e00406"
            
            infracost breakdown --path .
- stage: Plan
  jobs:
  - job: 
    displayName: Plan
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        backendServiceArm: 'AZ-ADO-connection-16'
        backendAzureRmOverrideSubscriptionID: '00ad737d-c579-441c-8386-0551f3fc4bf9'
        backendAzureRmResourceGroupName: 'rgkulvinder'
        backendAzureRmStorageAccountName: 'stgkulvinder'
        backendAzureRmContainerName: 'container1'
        backendAzureRmKey: 'dev.terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        environmentServiceNameAzureRM: 'AZ-ADO-connection-16'
        environmentAzureRmOverrideSubscriptionID: '00ad737d-c579-441c-8386-0551f3fc4bf9'

- stage: Manual_approval
  pool: server
  dependsOn: Plan
  jobs:
    - job: Approval
      displayName: Manual Approval
      steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'Kulvinder@harshitasumit1gmail.onmicrosoft.com'
          approvers: 'Kulvinder@harshitasumit1gmail.onmicrosoft.com'
          onTimeout: 'resume'

- stage: Apply
  dependsOn: Manual_approval
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: Apply
      displayName: Apply
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
          backendServiceArm: 'AZ-ADO-connection-16'
          backendAzureRmOverrideSubscriptionID: '00ad737d-c579-441c-8386-0551f3fc4bf9'
          backendAzureRmResourceGroupName: 'rgkulvinder'
          backendAzureRmStorageAccountName: 'stgkulvinder'
          backendAzureRmContainerName: 'container1'
          backendAzureRmKey: 'dev.terraform.tfstate'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
          commandOptions: '--auto-approve'
          environmentServiceNameAzureRM: 'AZ-ADO-connection-16'
          environmentAzureRmOverrideSubscriptionID: '00ad737d-c579-441c-8386-0551f3fc4bf9'
